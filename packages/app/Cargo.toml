[package]
name = "tune-box"
edition.workspace = true
version.workspace = true

[dependencies]
contracts = { path = "../contracts", package = "tune-box-contracts" }
backend = { path = "../backend", package = "tune-box-backend", optional = true }

dioxus.workspace = true
url.workspace = true
gloo-timers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-icons.workspace = true

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers"]
server = ["dioxus/server", "dep:backend", "dep:tokio", "dep:tokio-util"]
