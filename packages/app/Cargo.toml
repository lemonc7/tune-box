[package]
name = "tune-box"
edition.workspace = true
version.workspace = true

[dependencies]
contracts = { path = "../contracts", package = "tune-box-contracts" }
backend = { path = "../backend", package = "tune-box-backend", optional = true }

dioxus.workspace = true
url.workspace = true
gloo-timers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
dioxus-icons.workspace = true
rmcp = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers"]
server = [
  "dioxus/server",
  "dep:backend",
  "dep:rmcp",
  "dep:subtle",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tower",
  "dep:tower-http",
]
