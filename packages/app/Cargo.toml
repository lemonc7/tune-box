[package]
name = "app"
edition.workspace = true
version.workspace = true

[dependencies]
shared = { path = "../shared" }
service = { path = "../service", optional = true }

dioxus.workspace = true
url.workspace = true
gloo-timers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[features]
default = ["server"]
web = ["dioxus/web", "dep:gloo-timers"]
server = ["dioxus/server", "dep:service", "dep:tokio", "dep:tokio-util"]
