[workspace]
resolver = "2"
members = ["packages/app", "packages/service", "packages/shared"]


[workspace.package]
name = "tune-box"
version = "0.3.1"
edition = "2024"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }

async-trait = "0.1"

futures-util = "0.3"

reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "stream",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "fs",
  "io-util",
  "time",
  "signal",
  "net",
] }
tokio-util = { version = "0.7", features = ["rt"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "chrono",
  "env-filter",
  "fmt",
] }

lofty = "0.25"

time = "0.3"

sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "macros",
  "migrate",
  "time",
  "json",
] }

garde = { version = "0.23", features = ["derive", "url"] }


url = "2"
rust-embed = "8"
mime_guess = "2"

tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = [
  "trace",
  "request-id",
  "timeout",
  "limit",
  "compression-gzip",
] }

rmcp = { version = "3", features = [
  "server",
  "transport-streamable-http-server",
] }
moka = { version = "0.12", features = ["future"] }
