[package]
name = "tune-box"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "fs",
  "io-util",
  "time",
  "net",
] }
toml = "1"
tracing = "0.1"
lofty = "0.25"
time = { version = "0.3.55", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
  "derive",
  "time",
  "json",
] }
dotenvy = "0.15"
