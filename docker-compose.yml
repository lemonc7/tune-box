services:
  tune-go:
    image: lemonc7/tune-box:latest
    container_name: tune-box
    restart: unless-stopped
    depends_on:
      - ncm-api
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 8080:8080
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./downloads:/app/downloads

  ncm-api:
    image: moefurina/ncm-api:latest
    container_name: ncm-api
    restart: unless-stopped
