server:
  port: 8080
  http_timeout: 30s
  download_timeout: 30m
  mcp_token: token

database:
  max_open_conns: 4
  max_idle_conns: 4
  conn_max_lifetime: 0s
  conn_max_idle_time: 0s
  busy_timeout: 5s

download:
  max_bytes: 104857600
  max_concurrent: 2

providers:
  kuwo:
    search_url: https://search.kuwo.cn/r.s
    resolve_url: https://mobi.kuwo.cn/mobi.s
    lyric_url: https://www.kuwo.cn/openapi/v1/www/lyric/getlyric
