server:
  port: 8080
  http_timeout: 30s
  download_timeout: 30m

database:
  path: ./data/tune-go.db
  max_open_conns: 4
  max_idle_conns: 4
  conn_max_lifetime: 0s
  conn_max_idle_time: 0s
  busy_timeout: 5s

download:
  dir: ./downloads
  max_bytes: 104857600
  max_concurrent: 2

library:
  # 留空表示关闭定时扫描；启动扫描和 HTTP 手动扫描不受影响。
  scan_at: "03:00"
  timezone: Asia/Shanghai

providers:
  kuwo:
    search_url: https://search.kuwo.cn/r.s
    resolve_url: https://mobi.kuwo.cn/mobi.s
  netease:
    base_url:
    cookie:
    extended_resolve_url: https://music-api.gdstudio.xyz/api.php
