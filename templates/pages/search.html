{% extends "layout/base.html" %} {% block title %}搜索音乐 - Tune Box{% endblock
%} {% block content %}

<div class="space-y-6">
<section class="rounded-lg border border-zinc-200 bg-white p-6 shadow-sm sm:p-8">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight">搜索音乐</h1>
    <p class="mt-1 text-sm text-zinc-500">按歌曲、歌手或专辑搜索并添加下载任务。</p>
  </header>
  <form
    class="space-y-5"
    hx-get="/search"
    hx-target="#search-results"
    hx-swap="innerHTML"
    hx-indicator="#search-loading"
  >
    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-[12rem_minmax(0,1fr)]"
    >
      <label class="grid gap-2 text-sm font-medium text-zinc-700">
        音乐源
        <div class="relative">
          <select name="provider" required class="h-10 w-full appearance-none rounded-md border border-zinc-200 bg-white py-0 pr-10 pl-3 text-sm shadow-sm outline-none transition focus:border-zinc-400 focus:ring-2 focus:ring-zinc-950/10">
            {% for provider in providers %}
            <option value="{{provider}}">{{provider}}</option>
            {% endfor %}
          </select>
          <svg class="pointer-events-none absolute top-1/2 right-3.5 h-4 w-4 -translate-y-1/2 text-zinc-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="m6 8 4 4 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </label>
      <div class="grid gap-2 text-sm font-medium text-zinc-700">
        <label for="search-query">关键词</label>
        <span class="flex gap-2">
          <input
            id="search-query"
            type="search"
            name="q"
            required
            placeholder="歌曲、歌手或专辑"
            class="h-10 min-w-0 flex-1 rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-sm outline-none transition placeholder:text-zinc-400 focus:border-zinc-400 focus:ring-2 focus:ring-zinc-950/10"
          />
          <button type="submit" class="inline-flex h-10 shrink-0 cursor-pointer items-center justify-center rounded-md bg-zinc-900 px-4 text-sm font-medium text-white shadow-sm transition-colors hover:bg-zinc-800 disabled:pointer-events-none disabled:opacity-50">
            搜索
          </button>
        </span>
      </div>
    </div>
    <p class="text-sm text-zinc-500">当前仅支持下载 FLAC 无损音质，试听使用低码率音频。</p>

    <input type="hidden" name="page" value="1" />
    <input type="hidden" name="limit" value="20" />

    <span id="search-loading" class="invisible ml-3 text-sm text-zinc-500 opacity-0 transition-opacity duration-150 [&.htmx-request]:visible [&.htmx-request]:opacity-100">
      搜索中……
    </span>
  </form>
</section>

<section
  id="search-results"
  aria-live="polite"
  class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm sm:p-6"
>
  {% include "components/empty.html" %}
</section>
</div>

{% endblock %}
