{% extends "layout/base.html" %} {% block title %}本地曲库 - Tune Box{% endblock
%} {% block content %}
<section class="space-y-6">
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">本地曲库</h1>
      <p class="mt-1 text-sm text-zinc-500">共 {{ count }} 首歌曲</p>
    </div>
    <div class="flex items-center gap-2">
      <span id="library-sync-result" class="text-sm text-emerald-600"></span>
      <button
        type="button"
        hx-post="/library/sync"
        hx-target="#library-sync-result"
        hx-swap="innerHTML"
        hx-disabled-elt="this"
        class="inline-flex h-9 cursor-pointer items-center justify-center rounded-md border border-zinc-200 bg-white px-3 text-sm font-medium text-zinc-900 shadow-sm transition-colors hover:bg-zinc-100 disabled:pointer-events-none disabled:opacity-50"
      >
        同步曲库
      </button>
    </div>
  </header>

  <div class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-sm">
  <form
    action="/library"
    method="get"
    hx-get="/library/items"
    hx-target="#library-results"
    hx-swap="innerHTML"
    hx-trigger="submit, input changed delay:400ms from:#library-query, librarySyncDone from:body"
    hx-indicator="#library-loading"
    hx-sync="this:replace"
    class="flex gap-2 border-b border-zinc-100 p-4"
  >
    <input
      type="search"
      id="library-query"
      name="q"
      value="{{ query }}"
      placeholder="搜索歌曲或歌手"
      autocomplete="off"
      class="h-10 min-w-0 flex-1 rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-sm outline-none transition placeholder:text-zinc-400 focus:border-zinc-400 focus:ring-2 focus:ring-zinc-950/10"
    />
    <input type="hidden" name="limit" value="20" />
    <button type="submit" class="inline-flex h-10 cursor-pointer items-center justify-center rounded-md bg-zinc-900 px-4 text-sm font-medium text-white shadow-sm transition-colors hover:bg-zinc-800 disabled:pointer-events-none disabled:opacity-50">搜索</button>
  </form>

  <div
    id="library-loading"
    class="invisible px-4 pt-3 text-center text-sm text-zinc-500 opacity-0 transition-opacity duration-150 in-[.htmx-request]:visible in-[.htmx-request]:opacity-100 [&.htmx-request]:visible [&.htmx-request]:opacity-100"
  >
    正在查询……
  </div>
  <div id="library-results" class="divide-y divide-zinc-100" aria-live="polite">
    {% include "components/library_rows.html" %}
  </div>
  </div>
</section>
{% endblock %}
