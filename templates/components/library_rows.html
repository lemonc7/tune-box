{% if page.songs.is_empty() %}
<div class="m-4 rounded-lg border border-dashed border-zinc-200 bg-zinc-50/50 px-8 py-14 text-center text-sm text-zinc-500">没有找到符合条件的歌曲</div>
{% else %}
  {% for song in page.songs %}
  <article
    id="song-{{ song.id }}"
    class="group flex items-center gap-4 px-4 py-3.5 transition-colors hover:bg-zinc-50"
  >
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-zinc-100 text-sm font-semibold text-zinc-500"
      aria-hidden="true"
    >
      ♪
    </div>

    <div class="min-w-0 flex-1">
      <h2 class="truncate text-sm font-medium text-zinc-950">{{ song.name }}</h2>
      <p class="mt-0.5 truncate text-sm text-zinc-500">{{ song.artists }}</p>

      <div class="mt-2 flex items-center gap-2">
        <span
          class="rounded px-1.5 py-0.5 text-[0.65rem] font-semibold uppercase {{ song.extension_class }}"
        >
          {{ song.extension }}
        </span>
        <span class="text-xs text-zinc-400">{{ song.size }}</span>
      </div>
    </div>

    <button
      type="button"
      hx-post="/library/{{ song.id }}/delete"
      hx-target="closest article"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      hx-confirm="确定删除这首歌曲吗？本地音乐文件和关联的下载记录都会被删除。"
      class="inline-flex h-9 cursor-pointer items-center justify-center rounded-md border border-red-200 bg-white px-3 text-sm font-medium text-red-600 opacity-100 shadow-sm transition hover:bg-red-50 disabled:pointer-events-none disabled:opacity-50 sm:opacity-0 sm:group-hover:opacity-100"
    >
      删除
    </button>
  </article>
  {% endfor %}

  {% match page.next_url %}
    {% when Some with (next_url) %}
    <div
      hx-get="{{ next_url }}"
      hx-trigger="revealed"
      hx-target="this"
      hx-swap="outerHTML"
      class="py-3 text-center"
      aria-label="加载更多歌曲"
    >
      <span class="invisible text-sm text-zinc-500 opacity-0 transition-opacity duration-150 [.htmx-request_&]:visible [.htmx-request_&]:opacity-100 [&.htmx-request]:visible [&.htmx-request]:opacity-100">正在加载更多……</span>
    </div>
    {% when None %}
    <p class="py-4 text-center text-xs text-zinc-400">已经到底了</p>
  {% endmatch %}
{% endif %}
