<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="htmx-config"
      content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true},{"code":"...","swap":false,"error":true}]}'
    />
    <title>{% block title %}Tune Box{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script src="/assets/js/htmx.min.js" defer></script>
    <script src="/assets/js/ui.js" defer></script>
    <script src="/assets/js/player.js" defer></script>
    {% block head %}{% endblock %}
  </head>

  <body class="min-h-screen bg-zinc-50/60 text-zinc-950 antialiased">
    <header
      class="sticky top-0 z-10 border-b border-zinc-200 bg-white/90 backdrop-blur-md"
    >
      <nav
        class="mx-auto flex h-14 max-w-6xl items-center px-4 sm:px-6"
        aria-label="主导航"
        hx-boost="true"
        hx-target="#app-content"
        hx-select="#app-content > *"
        hx-swap="innerHTML"
        hx-push-url="true"
      >
        <a href="/" data-page-link class="mr-6 flex items-center gap-2 font-semibold tracking-tight">
          <span class="flex h-7 w-7 items-center justify-center rounded-md bg-zinc-900 text-sm text-white">♪</span>
          <span>Tune Box</span>
        </a>
        <div class="flex items-center gap-1">
          <a href="/" data-page-link class="rounded-md px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950">搜索</a>
          <a href="/downloads" data-page-link class="rounded-md px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950">下载</a>
          <a href="/library" data-page-link class="rounded-md px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950">曲库</a>
        </div>
      </nav>
    </header>
    <div
      id="app-error"
      class="mx-auto max-w-6xl px-4 pt-4 sm:px-6"
      aria-live="assertive"
    ></div>
    <main id="app-content" hx-history-elt class="mx-auto max-w-6xl px-4 py-8 pb-24 sm:px-6">
      {% block content %}{% endblock %}
    </main>

    <aside
      id="global-player"
      hx-preserve="true"
      class="fixed right-0 bottom-0 left-0 z-30 hidden border-t border-zinc-200 bg-white/95 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] backdrop-blur-md"
      aria-label="音乐试听播放器"
    >
      <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3 sm:px-6">
        <div
          id="player-cover-placeholder"
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-md bg-zinc-100 text-zinc-400"
          aria-hidden="true"
        >
          ♪
        </div>
        <img
          id="player-cover"
          src=""
          alt=""
          class="hidden h-11 w-11 shrink-0 rounded-md bg-zinc-100 object-cover"
        />

        <div class="min-w-0 w-36 shrink-0 sm:w-52">
          <p id="player-title" class="truncate text-sm font-medium text-zinc-950">尚未选择歌曲</p>
          <p id="player-artists" class="mt-0.5 truncate text-xs text-zinc-500"></p>
        </div>

        <audio id="global-audio" controls preload="none" class="h-9 min-w-0 flex-1"></audio>

        <button
          id="player-close"
          type="button"
          class="inline-flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-md text-zinc-500 transition-colors hover:bg-zinc-100 hover:text-zinc-950"
          aria-label="关闭播放器"
        >
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="m6 6 8 8M14 6l-8 8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </aside>
  </body>
</html>
